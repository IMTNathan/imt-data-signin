<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>IMT Data sign-in</title>
<style>
body{font:16px/1.5 system-ui,sans-serif;max-width:440px;margin:12vh auto;padding:0 20px;color:#111}
h1{font-size:22px}
button{font:inherit;padding:10px 18px;margin:8px 8px 0 0;border:1px solid #111;border-radius:6px;background:#111;color:#fff;cursor:pointer}
button.alt{background:#fff;color:#111}
</style>
<h1>IMT Data</h1>
<p id="msg">Loading...</p>
<div id="btns"></div>
<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2'
const sb = createClient('https://qjruoobyecsgxxgxbkja.supabase.co', 'sb_publishable_-KhWyifowntUK9kRHHGCxA_mOfuWMxA')
// Only requests that return to Claude can be approved.
const ALLOWED = ['https://claude.ai/api/mcp/auth_callback', 'https://claude.com/api/mcp/auth_callback']
const msg = document.getElementById('msg'), btns = document.getElementById('btns')
const say = t => { msg.textContent = t }
const btn = (t, f, alt) => { const b = document.createElement('button'); b.textContent = t; if (alt) b.className = 'alt'; b.onclick = f; btns.append(b) }
const finish = r => { if (r.error) say('Something went wrong: ' + r.error.message); else location.href = r.data.redirect_url }
const id = new URLSearchParams(location.search).get('authorization_id') || sessionStorage.getItem('authorization_id')
if (!id) {
  say('Open this page from Claude, by adding the IMT Data connector.')
} else {
  sessionStorage.setItem('authorization_id', id)
  const { data: { session } } = await sb.auth.getSession()
  if (!session) {
    say('Sign in with your IMT Microsoft account to continue.')
    btn('Sign in with Microsoft', () => sb.auth.signInWithOAuth({
      provider: 'azure',
      options: { scopes: 'email', redirectTo: location.origin + location.pathname + '?authorization_id=' + encodeURIComponent(id) }
    }))
  } else {
    const r = await sb.auth.oauth.getAuthorizationDetails(id)
    if (r.error) {
      say('Something went wrong: ' + r.error.message)
    } else if (!r.data.authorization_id && r.data.redirect_url) {
      location.href = r.data.redirect_url
    } else if (!ALLOWED.includes(r.data.redirect_uri)) {
      say('This request did not come from Claude, so it cannot be approved here. Close this page. (' + (r.data.redirect_uri || 'no return address') + ')')
    } else {
      say('Claude is asking to read IMT data as ' + session.user.email + '.')
      btn('Allow', async () => finish(await sb.auth.oauth.approveAuthorization(id)))
      btn('Deny', async () => finish(await sb.auth.oauth.denyAuthorization(id)), true)
      btn('Use a different account', async () => { await sb.auth.signOut(); location.reload() }, true)
    }
  }
}
</script>
</html>
